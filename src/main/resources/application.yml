# The single course offering this service manages (assessment scope: ONE offering).
offering:
  code: CS201          # identifier shown in API responses
  capacity: 3          # maximum number of enrolled learners (>= 1)
  prerequisite: CS101  # course a learner must have completed; leave empty for "no prerequisite"
  lock-timeout-millis: 2000   # max wait for the service lock before the request fails with 503 SERVICE_BUSY

# Records endpoint (PUT /api/learners/{id}/completed-courses) needs header X-Admin-Key equal to this value.
# Set via environment: ADMIN_API_KEY=... ; when blank the endpoint is disabled (403).
admin:
  api-key: ${ADMIN_API_KEY:}

spring:
  application:
    name: course-waitlist
